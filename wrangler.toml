name = "didinska-signal"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Cron dinonaktifkan — bot sekarang berbasis webhook (interaktif via menu),
# bukan push notifikasi otomatis.
# [triggers]
# crons = ["*/15 * * * *"]

# Durable Object untuk session per user (mode menu, foto chart yang dikirim, dll).
# Dipakai (bukan KV) supaya hitungan foto tidak race condition saat user kirim
# beberapa foto berturut-turut dengan cepat.
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

# Migration wajib ada saat pertama kali Durable Object class ini dideploy.
# new_sqlite_classes dipakai supaya tetap gratis di Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

[vars]
# Masih dipertahankan untuk dipakai lagi nanti saat fitur analisis chart aktif
SYMBOL = "BTCUSDT"
INTERVAL = "15m"
CANDLE_LIMIT = "100"

# Secrets (set via CLI atau dashboard Cloudflare, JANGAN ditulis di sini):
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
