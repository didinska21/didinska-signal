name = "didinska-signal"
main = "src/index.js"
compatibility_date = "2024-11-01"

# --- Variable non-rahasia (BUKAN secret/password/API key) ---
# Ditaruh LANGSUNG di sini (bukan lewat dashboard Cloudflare) supaya
# NGGAK PERNAH HILANG lagi tiap kali GitHub push memicu deploy ulang —
# ini penyebab MT5_BRIDGE_SECRET & MT5_AUTONOMOUS_XAUUSD sempat "hilang"
# kemarin: variable yang di-set manual lewat dashboard TIDAK DIJAMIN
# selalu bertahan lintas deploy, sedangkan yang ditulis di sini SELALU
# ikut ke-deploy karena jadi bagian dari kode yang di-commit ke GitHub.
#
# Untuk mengaktifkan mode OTONOM XAUUSD: ubah baris di bawah jadi "true",
# commit, push. JANGAN ubah lewat dashboard lagi, biar tidak "hilang" lagi.
[vars]
MT5_AUTONOMOUS_XAUUSD = "true"
MT5_MAX_TRADES_PER_DAY = "999999999"
MT5_MAX_DAILY_LOSS_PCT = "999999999"
MT5_DEFAULT_LOT = "0.01"
GROQ_TEXT_MODEL = "openai/gpt-oss-120b"
GROQ_SUMMARY_MODEL = "openai/gpt-oss-120b"

# Cron dinonaktifkan — bot sekarang berbasis webhook (interaktif via menu),
# bukan push notifikasi otomatis.
# [triggers]
# crons = ["*/15 * * * *"]

# Durable Object untuk session per user (mode menu, foto chart yang dikirim, dll).
# Dipakai (bukan KV) supaya hitungan foto tidak race condition saat user kirim
# beberapa foto berturut-turut dengan cepat.
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

# Durable Object GLOBAL (1 instance untuk semua chat) buat nyimpen riwayat
# sinyal & hasilnya (TP/SL), dasar penghitungan win-rate beneran. Sengaja
# dipisah dari SESSION_DO supaya riwayatnya tidak ikut kehapus tiap /start
# atau /batal (yang mereset SESSION_DO).
[[durable_objects.bindings]]
name = "SIGNAL_LOG_DO"
class_name = "SignalLogDO"

# Durable Object jembatan MT5: 1 instance PER SIMBOL (misal "XAUUSD"),
# nyimpen cache candle yang di-push bridge Python + antrian sinyal yang
# perlu dieksekusi ke MT5. Lihat src/mt5_bridge_do.js.
[[durable_objects.bindings]]
name = "MT5_BRIDGE_DO"
class_name = "Mt5BridgeDO"

# Migration wajib ada saat pertama kali Durable Object class ini dideploy.
# new_sqlite_classes dipakai supaya tetap gratis di Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

# Migration baru khusus buat SignalLogDO (class baru) — migration lama (v1)
# JANGAN diubah/dihapus, Durable Object migration itu selalu nambah tag baru,
# bukan mengedit yang sudah pernah dideploy.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["SignalLogDO"]

# Migration baru khusus buat Mt5BridgeDO — sama alasannya, migration lama
# (v1, v2) JANGAN diubah/dihapus.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Mt5BridgeDO"]

# Secrets (set via CLI atau dashboard Cloudflare, JANGAN ditulis di sini):
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put MT5_BRIDGE_SECRET
