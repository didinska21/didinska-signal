name = "futures-signal-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Jadwal cron: tiap 15 menit. Sesuaikan sesuai timeframe sinyal yang diinginkan.
# Format cron standar (UTC). Contoh lain: "0 * * * *" = tiap jam.
[triggers]
crons = ["*/15 * * * *"]

# Secrets (JANGAN ditulis di sini, set via CLI):
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID

[vars]
# Variabel non-rahasia, boleh ditulis langsung di sini
SYMBOL = "BTCUSDT"
INTERVAL = "15m"        # interval candle Binance: 1m,5m,15m,1h,4h,1d
CANDLE_LIMIT = "100"    # jumlah candle historis yang diambil
